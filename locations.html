<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locations | /pw Highway</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,100..900;1,50..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="index.html">/pw <span>Highway</span></a>
  <button class="menu-btn" aria-expanded="false">Menu</button>
  <nav aria-label="Main"><ul>
    <li><a href="index.html">Overview</a></li>
    <li><a href="locations.html" aria-current="page">Locations</a></li>
    <li><a href="progress.html">Progress</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="rules.html">Rules</a></li>
    <li><a href="apply.html">Forum</a></li>
    <li><a href="credits.html">Credits</a></li>
  </ul></nav>
</div></header>
<main><div class="wrap">
  <h1>Locations</h1>
  <p>Stops along the Highway, in order from -X to +X.</p>
  <div class="map-toolbar">
    <!-- Overview / Live switch is hidden: the live map is the default. Remove `hidden` to bring the switch back. -->
    <div class="view-switch" role="group" aria-label="Map view" hidden>
      <button type="button" data-view="overview" aria-pressed="true">Overview</button>
      <button type="button" data-view="live" aria-pressed="false"><i class="live-dot" aria-hidden="true"></i>Live map</button>
    </div>
    <span class="map-hint" id="map-hint">Click a dot for details.</span>
  </div>
  <div class="mapbox"><div id="map" hidden></div><div id="live"></div></div>
  <p class="map-credit">Terrain from the <a href="https://lotus.blossomcraft.org" target="_blank" rel="noopener">Lotus live map</a>.</p>
  <div class="filters" id="filters" aria-label="Filter by type"></div>
  <ul class="route" id="route"></ul>
</div></main>
<footer><div class="wrap">/pw Highway on Lotus</div></footer>
<script src="js/data.js"></script>
<script src="js/claims.js"></script>
<script src="js/main.js"></script>
</body>
</html>
